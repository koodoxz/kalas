name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test Userspace Agent (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Cargo Check Userspace
        run: cargo check -p heimdall

      - name: Build Userspace Agent
        run: cargo build --release -p heimdall

      - name: Run Tests
        run: cargo test -p heimdall --verbose
